<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Mobile App Simulator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </div>
        <div>
          <h2>YouTube Mobile</h2>
          <span class="subtitle">App Simulator Extension</span>
        </div>
      </div>
      <div class="badge">v1.0.0</div>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
      <div class="setting-item">
        <div class="setting-info">
          <label class="setting-title" for="toggle-miniplayer">Floating Mini-Player</label>
          <span class="setting-desc">Vừa xem video vừa lướt Trang chủ, Kênh đăng ký, Tìm kiếm.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-miniplayer" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <label class="setting-title" for="toggle-background">Phát Nhạc Nền (Background Audio)</label>
          <span class="setting-desc">Tiếp tục phát nhạc khi chuyển tab hoặc ẩn trình duyệt.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-background" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <label class="setting-title" for="toggle-autominimize">Tự động thu nhỏ khi chuyển trang</label>
          <span class="setting-desc">Tự kích hoạt mini-player khi rời khỏi trang video đang xem.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-autominimize" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="status-banner" id="status-banner">
      <span class="status-dot"></span>
      <span>Đang hoạt động trên m.youtube.com</span>
    </div>

    <div class="footer">
      <button id="btn-open-yt" class="btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        Mở YouTube Mobile Web
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
